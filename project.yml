name: DailyWordWidget
options:
  bundleIdPrefix: com.ufuk
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
targets:
  DailyWordWidget:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Shared
    dependencies:
      - package: Supabase
      - target: DailyWordWidgetExtension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ufuk.DailyWordWidget
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      CURRENT_PROJECT_VERSION: 2
      MARKETING_VERSION: 1.0
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: App/DailyWordWidget.entitlements
      DEVELOPMENT_TEAM: JZDSNA36C9
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Wordlet"
        CFBundleIconName: "AppIcon"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.ufuk.DailyWordWidget
            CFBundleURLSchemes:
              - com.ufuk.DailyWordWidget
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  DailyWordWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widget
      - Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ufuk.DailyWordWidget.WidgetExtension
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 2
      MARKETING_VERSION: 1.0
      CODE_SIGN_ENTITLEMENTS: Widget/DailyWordWidgetExtension.entitlements
      DEVELOPMENT_TEAM: JZDSNA36C9
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "Wordlet Widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  DailyWordWidget:
    build:
      targets:
        DailyWordWidget: [run, test, profile, analyze, archive]
  DailyWordWidgetExtension:
    build:
      targets:
        DailyWordWidgetExtension: [run, test, profile, analyze, archive]
